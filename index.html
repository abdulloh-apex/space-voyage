<style>
/* ------------------------------------------------------------------
   Fonts. Sources are local() only, so a machine without the faces

@font-face{font-family:'SF Pro';font-style:normal;font-weight:400;font-display:swap;
  src:local('SF Pro'),local('SF Pro Regular'),local('SF Pro Text'),local('SF Pro Text Regular'),
      local('SF Pro Display'),local('SF Pro Display Regular'),local('SFProText-Regular'),local('SFProDisplay-Regular')}
@font-face{font-family:'SF Pro';font-style:normal;font-weight:700;font-display:swap;
  src:local('SF Pro Bold'),local('SF Pro Text Bold'),local('SF Pro Display Bold'),
      local('SFProText-Bold'),local('SFProDisplay-Bold')}
@font-face{font-family:'SF Pro Thin';font-style:normal;font-weight:100;font-display:swap;
  src:local('SF Pro Thin'),local('SF Pro Display Thin'),local('SF Pro Text Thin'),
      local('SFProDisplay-Thin'),local('SFProText-Thin')}
@font-face{font-family:'Aalto';font-style:normal;font-weight:400;font-display:swap;
  src:local('Aalto'),local('Aalto Regular'),local('Aalto-Regular')}

:root{font-family:'SF Pro',Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#090807}
button{font:inherit;-webkit-tap-highlight-color:transparent}
html,body,button,a,.portal{cursor:none!important}

/* ------------------------------------------------------------------
   Stage
   ------------------------------------------------------------------ */
.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease}
.background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}

/* Sidebar: every planet is a button that travels there */
.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;
  align-items:flex-start;gap:6px;font-size:16px}
.planet-item{display:flex;align-items:center;min-height:20px;padding:0;border:0;background:none;color:#fff;
  font-size:inherit;text-align:left;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.planet-item:hover{transform:translateX(5px)}
.planet-item.active:hover{transform:none}
.planet-item:focus{outline:none}
.planet-item:focus-visible{outline:1px solid rgba(255,255,255,.85);outline-offset:4px;border-radius:4px}
.planet-item.active{font-size:18px;font-weight:700;gap:8px}
.planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}

/* Portal: the real media are invisible pixel sources the canvas samples */
.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
.portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
.portal-heading strong{font-size:18px;margin-left:8px}
.portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;
  border-radius:90px;background:transparent;color:inherit;cursor:pointer;box-shadow:none;transform:none!important}
.portal:focus{outline:none}
.portal:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:6px}
.portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
.portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}

/* Planet content */
.planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);
  display:flex;justify-content:space-between;align-items:flex-end;gap:40px;pointer-events:none}
.planet-content h1{--title-shift:-32px;font-family:Aalto,'Arial Narrow',sans-serif;font-size:clamp(128px,21.8vw,314px);
  font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(var(--title-shift));opacity:0;
  min-width:0;white-space:nowrap}
.planet-content dl{width:min(447px,34vw);margin:0;font-size:16px;flex-shrink:0;pointer-events:auto}
.fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
.fact:last-child{border-bottom:0}
.fact dt{font-weight:700}
.fact dd{margin:0}

/* Misc */
.transition-layer{display:none}
.loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;pointer-events:none;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
.experience.is-loading .loading{opacity:.8}
.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
.experience.is-transitioning .shade{opacity:1}
.experience.is-committing .background{transition:none!important}

/* ------------------------------------------------------------------
   Preloader
   ------------------------------------------------------------------ */
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-background{z-index:0}
.preloader.is-background .preloader-shade{opacity:0}
.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:110px;height:58px;object-fit:contain;transform:translate(-50%,-50%);
  will-change:left,top,width,height,transform;
  transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),
             height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:68px;height:36px;transform:none}
.floating-logo.is-settled{z-index:5}
.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;
  gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1}
.preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100;
  font-variant-numeric:tabular-nums}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}

/* ------------------------------------------------------------------
   Custom cursor
   ------------------------------------------------------------------ */
.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;
  pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);
  transition:transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit,.custom-cursor.is-hover .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
.cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);
  font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;
  transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}
@media(hover:none){.custom-cursor{display:none}}

/* ------------------------------------------------------------------
   Entrance / switch animations
   ------------------------------------------------------------------ */
.planet-list,.planet-content h1,.planet-content .fact{opacity:0}
.intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
.content-revealing h1{animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both}
.content-revealing .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
.content-revealing .fact:nth-child(1){animation-delay:.52s}
.content-revealing .fact:nth-child(2){animation-delay:.68s}
.content-revealing .fact:nth-child(3){animation-delay:.84s}
.content-revealing .fact:nth-child(4){animation-delay:1s}
.mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}
.planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}
.planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}
.planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}
.planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}
.planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}
.planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}
.planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
.planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}

@keyframes reveal-down{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes title-rise{from{opacity:0;filter:blur(12px);transform:translate(var(--title-shift),42px)}to{opacity:1;filter:blur(0);transform:translate(var(--title-shift),0)}}
@keyframes fact-rise{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes active-dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

/* ------------------------------------------------------------------
   Responsive
   ------------------------------------------------------------------ */
@media(max-width:900px){
  .portal-wrap{width:min(300px,48vw)}
  .planet-content h1{--title-shift:-.06em;font-size:clamp(105px,24vw,190px)}
  .planet-content dl{width:43vw}
  .fact{grid-template-columns:110px 1fr}
  .planet-list{font-size:14px}
  .planet-item.active{font-size:16px}
}
@media(max-width:640px){
  .experience{min-height:600px}
  .planet-list{display:none}
  .portal-wrap{top:44%;width:min(260px,66vw)}
  .planet-content{left:18px;right:18px;bottom:18px;display:block}
  .planet-content h1{font-size:clamp(98px,30vw,160px);margin-bottom:20px}
  .planet-content dl{width:100%;font-size:13px}
  .fact{grid-template-columns:92px 1fr;padding:5px 0}
  .portal-heading{font-size:14px}
  .portal-heading strong{font-size:16px}
  .portal{border-radius:70px}
}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
  .portal{transform:none!important}
}
</style>

  /* ----------------------------------------------------------------
     Assets & data
     ---------------------------------------------------------------- */

  const TO_EARTH = `${BASE}/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4`;
  const TO_VENUS = `${BASE}/b30f64d9-1637-477a-83df-d0fc6461a422.mp4`;

  // The sidebar lists planets outward from the Sun; the portal walks TOUR in a loop.
  const SOLAR = ['mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];

  /* ----------------------------------------------------------------

  /* ----------------------------------------------------------------
     Helpers
     ---------------------------------------------------------------- */
  const ease = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const nextFrame = () => new Promise(resolve => requestAnimationFrame(resolve));

  // Calls fn with raw progress 0..1 every frame for `duration` ms.
  function animate(fn, duration) {
    return new Promise(resolve => {
      const start = performance.now();
      const step = now => {
        const t = Math.min(1, Math.max(0, (now - start) / duration));
        fn(t);
        if (t < 1) requestAnimationFrame(step); else resolve();
      };
      requestAnimationFrame(step);
    });
  }
  const animateValue = (setter, duration) => animate(t => setter(ease(t)), duration);

  // Resolve on the first of several events, or after `timeout` ms.
  function waitFor(target, events, timeout) {
    return new Promise(resolve => {
      let timer = 0;
      const done = () => {
        clearTimeout(timer);
        events.forEach(name => target.removeEventListener(name, done));
        resolve();
      };
      events.forEach(name => target.addEventListener(name, done));
      if (timeout) timer = setTimeout(done, timeout);
    });
  }

  function waitForMedia(media, timeout = 4000) {
    if (!media) return Promise.resolve();
    if (media instanceof HTMLImageElement) {
      return media.complete ? Promise.resolve() : waitFor(media, ['load', 'error'], timeout);
    }
    if (!(media instanceof HTMLVideoElement)) return Promise.resolve();
    if (media.readyState >= 2 || media.error) return Promise.resolve();
    return waitFor(media, ['loadeddata', 'canplay', 'error'], timeout);
  }

  function waitForEnd(video) {
    if (video.ended) return Promise.resolve();
    // Fallback in case 'ended' never arrives (stalled network, tab throttling).
    const remaining = Number.isFinite(video.duration)
      ? Math.max(0, video.duration - video.currentTime) / (video.playbackRate || 1) * 1000
      : 8000;
    return waitFor(video, ['ended'], remaining + 4000);
  }

  function retrigger(el, className) {
    el.classList.remove(className);
    void el.offsetWidth;

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
  }

  // Copies the current frame of a video into a canvas so it can be shown later.
  function captureFrame(video) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh || video.readyState < 2) return null;
    const s = Math.min(1, 2560 / vw);
    const still = document.createElement('canvas');
    still.width = Math.round(vw * s);
    still.height = Math.round(vh * s);
    still.getContext('2d').drawImage(video, 0, 0, still.width, still.height);
    return still;
  }

  function clockOf(key, now) {
    if (epochs[key] === undefined) epochs[key] = now;
    return (now - epochs[key]) / 1000;
  }

  /* ----------------------------------------------------------------
     Where each planet's picture comes from
     ---------------------------------------------------------------- */
  function stillMedia(key) {
    if (key === 'mercury') {
      return portalImage.complete && portalImage.naturalWidth >= 720 ? portalImage : null;
    }
    if (key === 'mars' && !stills.mars && preloaderVideo.ended) stills.mars = captureFrame(preloaderVideo);
    return stills[key] || null;
  }

  // How the trip to `key` will look: its video, a photo, or the WebGL renderer.
  function arrivalOf(key) {
    const state = states[key];
    if (!failed.has(key)) {
      if (state.clip) return { mode: 'clip', clip: state.clip };
      if (state.still) {
        const media = stillMedia(key);
        if (media) return { mode: 'still', media };
      }
    }
    return { mode: 'render' };
  }

  function previewMedia(key) {
    const arrival = arrivalOf(key);
    if (arrival.mode === 'clip') return portalVideo;
    return arrival.mode === 'still' ? arrival.media : null;
  }

  /* ----------------------------------------------------------------
     Rendering of DOM state
     ---------------------------------------------------------------- */
  function render() {
    const state = states[current];
    const next = nextOf(current);
    experience.dataset.planet = current;
    title.textContent = state.name.toUpperCase();
    setHeading(next);

    facts.innerHTML = state.facts
      .map(([key, value]) => `<div class="fact"><dt>${key}</dt><dd>${value}</dd></div>`)
      .join('');

      .map(key => {
        const active = key === current;

          `${active ? ' aria-current="true"' : ''}>${states[key].name}</button>`;
      })
      .join('');
    cursor.classList.remove('is-hover');
    if (rendered) retrigger(planetList, 'is-switching');
    rendered = true;

    backgrounds.forEach(video => video.classList.toggle('is-visible', video.id === `${current}-background`));

    // Prepare the portal's preview of the next stop.
    epochs[next] = performance.now();
    if (states[next].clip && portalVideoKey !== next) {
      portalVideoKey = next;
      portalVideo.src = states[next].clip;

  }

  function setHeading(key) {
    nextName.textContent = states[key].name;
    nextNumber.textContent = numberOf(key);

  }

  // Keeps the giant title inside its column when the display face is
  // missing and a wider fallback is in use. With Aalto it is a no-op.
  function fitTitle() {
    title.style.fontSize = '';
    const range = document.createRange();
    range.selectNodeContents(title);
    const textWidth = range.getBoundingClientRect().width;
    const boxWidth = title.clientWidth;
    if (boxWidth > 0 && textWidth > boxWidth + .5) {
      const size = parseFloat(getComputedStyle(title).fontSize);
      title.style.fontSize = `${Math.floor(size * boxWidth / textWidth)}px`;

  /* ----------------------------------------------------------------
     WebGL planet renderer
     ---------------------------------------------------------------- */
  const VERTEX_SHADER = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

  const FRAGMENT_SHADER = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes;      // size of the region being drawn, in buffer pixels
uniform vec4 uRect;     // the same region in CSS pixels (x, y, w, h)
uniform vec2 uView;     // viewport size in CSS pixels
uniform vec2 uCenter;   // optical centre in CSS pixels
uniform float uFocal, uDist, uPitch, uBank, uTime, uSpeed, uSeed, uPix;
uniform mat3 uOrient;   // world -> planet frame
uniform vec3 uLight;
uniform float uKind;
uniform vec3 uC0, uC1, uC2, uC3;
uniform vec4 uGas;      // bands, turbulence, contrast, streaks
uniform vec4 uSpot;     // lat, lon, size, strength
uniform vec3 uSpotCol;
uniform vec4 uRing;     // inner, outer, opacity, style
uniform vec3 uRingCol;
uniform vec4 uAtmo;     // rgb, strength
uniform vec4 uRock;     // craters, ice, spin, haze height

const float PI = 3.14159265;

float hash11(float p) { p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float hash13(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }

float noise1(float x) {
  float i = floor(x), f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(hash11(i), hash11(i + 1.0), f);
}
float noise3(vec3 x) {
  vec3 i = floor(x), f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i), hash13(i + vec3(1, 0, 0)), f.x),
                 mix(hash13(i + vec3(0, 1, 0)), hash13(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash13(i + vec3(0, 0, 1)), hash13(i + vec3(1, 0, 1)), f.x),
                 mix(hash13(i + vec3(0, 1, 1)), hash13(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * noise3(p); p = p * 2.03 + vec3(17.1, 3.7, 9.2); a *= 0.5; }
  return s / 0.96875;
}
float fbm3(vec3 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) { s += a * noise3(p); p = p * 2.07 + vec3(5.3, 11.9, 2.1); a *= 0.5; }
  return s / 0.875;
}
vec3 rotY(vec3 p, float a) { float c = cos(a), s = sin(a); return vec3(c * p.x - s * p.z, p.y, s * p.x + c * p.z); }
float angDiff(float a, float b) { return mod(a - b + PI, 2.0 * PI) - PI; }
float bump(float r, float c, float w) { float x = (r - c) / w; return exp(-x * x); }

/* ---------- gas giants (and Venus' clouds) ---------- */
vec3 gasColor(vec3 p, float t) {
  float lat = asin(clamp(p.y, -1.0, 1.0));
  // zonal winds: neighbouring bands drift at slightly different rates
  vec3 q = rotY(p, t * (uRock.z + 0.0025 * sin(lat * uGas.x * 0.5)));
  float w1 = fbm3(q * vec3(1.7, 5.0, 1.7) + vec3(uSeed, 0.0, t * 0.012));
  float w2 = fbm(q * vec3(3.6, 17.0, 3.6) + vec3(w1 * 2.6, uSeed, w1 * 1.9));
  // finer eddies, only worth computing when the camera is close
  float near = smoothstep(5.0, 1.6, uDist);
  float w3 = near > 0.0 ? fbm3(q * vec3(11.0, 46.0, 11.0) + vec3(w2 * 3.0, uSeed, w1 * 2.0)) : 0.5;
  float spot = 0.0, rs = 9.0;
  if (uSpot.w > 0.0) {
    vec2 sd = vec2(angDiff(atan(q.z, q.x), uSpot.y) * cos(lat) / (uSpot.z * 1.7), (lat - uSpot.x) / uSpot.z);
    rs = length(sd);
    if (rs < 1.6) {
      spot = 1.0 - smoothstep(0.7, 1.05, rs);
      float ang = atan(sd.y, sd.x) + (1.0 - min(rs, 1.0)) * 5.0 + t * 0.05;
      float swirl = fbm3(vec3(cos(ang) * rs * 3.0, sin(ang) * rs * 3.0, uSeed + t * 0.02));
      w2 = mix(w2, swirl, spot);
      lat += sd.y * uSpot.z * exp(-rs * rs * 1.5) * 0.7;
    }
  }
  float y = lat + ((w1 - 0.5) * 0.16 + (w2 - 0.5) * 0.1 + (w3 - 0.5) * 0.035 * near) * uGas.y;
  float v = noise1(y * uGas.x * 0.55 + uSeed);
  float zone = smoothstep(-0.45, 0.45, sin(y * uGas.x) + (v - 0.5) * 1.1);
  vec3 col = mix(uC0, uC1, zone);
  col = mix(col, uC2, smoothstep(0.5, 0.85, noise1(y * uGas.x * 0.31 + 7.0 + uSeed)) * 0.75);
  col *= 1.0 + ((w2 - 0.5) + (w3 - 0.5) * 0.8 * near) * uGas.z;
  col = mix(col, uC3, smoothstep(0.75, 1.35, abs(lat)));
  if (uSpot.w > 0.0) {
    float collar = smoothstep(0.7, 1.0, rs) * (1.0 - smoothstep(1.0, 1.4, rs));
    col = mix(col, uSpotCol * (0.8 + 0.45 * w2), spot * uSpot.w);
    col = mix(col, uC1 * 1.04, collar * 0.4 * uSpot.w);
  }
  if (uGas.w > 0.0) {
    float s = smoothstep(0.6, 0.74, fbm3(q * vec3(2.4, 20.0, 2.4) + vec3(uSeed * 3.0, 0.0, t * 0.01)));
    col = mix(col, vec3(0.9, 0.94, 1.0), s * uGas.w);
  }
  return col;
}

/* ---------- rocky worlds ---------- */
float crater(vec3 p, float scale, float seed) {
  vec3 c = p * scale;
  vec3 id = floor(c);
  if (hash13(id + seed) < 0.5) return 0.0;
  vec3 ctr = 0.3 + 0.4 * vec3(hash13(id + seed + 1.7), hash13(id + seed + 4.3), hash13(id + seed + 8.9));
  float rad = 0.1 + 0.18 * hash13(id + seed + 13.1);
  float d = length(c - id - ctr) / rad;
  float bowl = d < 1.0 ? d * d - 1.0 : 0.0;
  float rim = exp(-(d - 1.0) * (d - 1.0) * 18.0) * 0.45;
  return (bowl * 0.8 + rim) * rad / scale;
}
float craters(vec3 p) {
  return crater(p, 5.0, 0.0) + crater(p, 11.0, 21.0) + crater(p, 23.0, 43.0) + crater(p, 49.0, 67.0) * 0.8;
}
vec3 rockColor(vec3 q) {
  float n1 = fbm(q * 2.2 + uSeed);
  float n2 = fbm3(q * 8.0 + uSeed * 1.3);
  vec3 col = mix(uC0, uC1, smoothstep(0.3, 0.72, n1));
  col = mix(col, uC2, smoothstep(0.5, 0.8, n2) * 0.45);
  col = mix(col, uC3, smoothstep(0.56, 0.7, fbm3(q * 1.4 + uSeed + 5.0)) * 0.7);
  col = mix(col, vec3(0.94, 0.92, 0.9), uRock.y * smoothstep(0.86, 0.92, abs(q.y) + (n2 - 0.5) * 0.12));
  return col;
}

/* ---------- ocean world (fallback Earth) ---------- */
vec3 earthColor(vec3 q, vec3 qc, out float water, out float cloud) {
  float n = fbm(q * 1.9 + uSeed) * 0.8 + fbm3(q * 7.0) * 0.2;
  float land = smoothstep(0.53, 0.56, n);
  vec3 ocean = mix(uC0, uC1, smoothstep(0.38, 0.54, n));
  float dry = fbm3(q * 3.5 + 11.0) + (0.3 - abs(q.y)) * 0.35;
  vec3 ground = mix(uC2, uC3, smoothstep(0.45, 0.62, dry));
  vec3 col = mix(ocean, ground, land);
  float ice = smoothstep(0.8, 0.86, abs(q.y) + (n - 0.5) * 0.25);
  col = mix(col, vec3(0.92, 0.94, 0.96), ice);
  water = (1.0 - land) * (1.0 - ice);
  float c1 = fbm(qc * 3.0 + vec3(0.0, uSeed, 0.0));
  float c2 = fbm3(qc * vec3(4.0, 9.0, 4.0) + c1 * 2.0);
  cloud = smoothstep(0.5, 0.72, c1 * 0.6 + c2 * 0.4);
  return mix(col, vec3(0.96), cloud * 0.92);
}

/* ---------- rings ---------- */
float ringDensity(float r) {
  if (r < uRing.x || r > uRing.y) return 0.0;
  float d;
  if (uRing.w < 0.5) {
    float x = (r - uRing.x) / (uRing.y - uRing.x);
    d = 0.55 + 0.3 * noise1(r * 38.0) + 0.15 * noise1(r * 140.0);
    d *= x < 0.28 ? 0.35 : (x < 0.69 ? 1.15 : 0.8);                     // C, B and A rings
    d *= 1.0 - 0.92 * (smoothstep(0.68, 0.695, x) - smoothstep(0.75, 0.765, x)); // Cassini division
    d *= 1.0 - 0.6 * (smoothstep(0.935, 0.94, x) - smoothstep(0.948, 0.953, x)); // Encke gap
    d *= smoothstep(0.0, 0.01, x) * smoothstep(1.0, 0.99, x);
  } else {
    d = bump(r, 1.64, 0.004) * 0.5 + bump(r, 1.67, 0.004) * 0.5 + bump(r, 1.70, 0.004) * 0.5
      + bump(r, 1.75, 0.006) * 0.7 + bump(r, 1.79, 0.006) * 0.7 + bump(r, 1.85, 0.005) * 0.6
      + bump(r, 1.88, 0.005) * 0.6 + bump(r, 1.92, 0.006) * 0.7 + bump(r, 2.0, 0.014);
  }
  return clamp(d, 0.0, 1.0) * uRing.z;
}

/* ---------- stars ---------- */
vec3 starLayer(vec3 d, float scale, float keep, float seed) {
  vec3 c = d * scale;
  vec3 id = floor(c);
  float h = hash13(id + seed);
  if (h > keep) return vec3(0.0);
  vec3 o = vec3(hash13(id + seed + 3.1), hash13(id + seed + 7.7), hash13(id + seed + 1.9));
  float size = uPix * scale * 1.5;
  float b = smoothstep(size, size * 0.1, length(c - id - o)) * (0.3 + 0.7 * hash13(id + seed + 5.5));
  return mix(vec3(1.0, 0.86, 0.72), vec3(0.76, 0.85, 1.0), hash13(id + seed + 9.4)) * b;
}
vec3 stars(vec3 d) {
  return starLayer(d, 70.0, 0.09, 0.0) + starLayer(d, 180.0, 0.07, 41.0) * 0.7;
}
vec3 starfield(vec3 rd, vec3 fwd) {
  if (uSpeed < 0.02) return stars(rd);
  vec3 acc = vec3(0.0);
  for (int k = 0; k < 5; k++) acc += stars(normalize(rd + (rd - fwd) * uSpeed * 0.1 * float(k) / 4.0));
  return acc * 0.45;
}

void main() {
  vec2 css = uRect.xy + vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uRes * uRect.zw;
  vec2 px = css - uCenter;
  float cb = cos(uBank), sb = sin(uBank);
  px = vec2(cb * px.x - sb * px.y, sb * px.x + cb * px.y);
  vec3 rd = normalize(vec3(px.x, -px.y, -uFocal));
  float cp = cos(uPitch), sp = sin(uPitch);
  rd = vec3(rd.x, cp * rd.y - sp * rd.z, sp * rd.y + cp * rd.z);
  vec3 fwd = vec3(0.0, sp, -cp);
  vec3 ro = vec3(0.0, 0.0, uDist);
  vec3 L = uLight;

  float b = dot(ro, rd);
  float disc = b * b - (dot(ro, ro) - 1.0);
  float tPlanet = 1e9;
  if (disc > 0.0) { float tt = -b - sqrt(disc); if (tt > 0.0) tPlanet = tt; }

  vec3 col;
  if (tPlanet > 1e8) {
    col = starfield(rd, fwd);
    // atmosphere glow around the limb
    vec3 cpt = ro + rd * max(-b, 0.0);
    float lit = smoothstep(-0.35, 0.55, dot(normalize(cpt), L));
    col += uAtmo.rgb * exp(-(length(cpt) - 1.0) / uRock.w) * uAtmo.w * lit;
  } else {
    vec3 n = normalize(ro + rd * tPlanet);
    vec3 p = uOrient * n;
    float ndl = dot(n, L);
    float mu = max(dot(n, -rd), 0.0);
    if (uKind < 0.5) {
      vec3 surf = gasColor(p, uTime) * mix(0.62, 1.0, pow(mu, 0.45));
      col = surf * (smoothstep(-0.12, 0.65, ndl) * 1.08 + 0.012);
    } else if (uKind < 1.5) {
      float spin = uTime * uRock.z;
      vec3 q = rotY(p, spin);
      vec3 Lq = rotY(uOrient * L, spin);
      float relief = 0.0;
      if (uRock.x > 0.0 && ndl > -0.1) {
        vec3 Lt = normalize(Lq - q * ndl + vec3(1e-5));
        relief = (craters(q) - craters(normalize(q + Lt * 0.0025))) / 0.0025 * uRock.x;
      }
      float light = clamp(ndl + relief * sqrt(max(0.0, 1.0 - ndl * ndl)), 0.0, 1.5) * smoothstep(-0.08, 0.1, ndl);
      col = rockColor(q) * (light + 0.01);
    } else {
      float water, cloud;
      vec3 q = rotY(p, uTime * uRock.z);
      vec3 qc = rotY(p, uTime * uRock.z * 1.35 + 0.7);
      col = earthColor(q, qc, water, cloud) * (smoothstep(-0.08, 0.5, ndl) + 0.01);
      float spec = pow(max(dot(reflect(-L, n), -rd), 0.0), 30.0);
      col += vec3(1.0, 0.95, 0.85) * spec * water * (1.0 - cloud) * 0.45 * step(0.0, ndl);
    }
    // shadow of the rings on the cloud tops
    if (uRing.z > 0.0) {
      vec3 Lp = uOrient * L;
      if (abs(Lp.y) > 1e-4) {
        float ts = -p.y / Lp.y;
        if (ts > 0.0) col *= 1.0 - 0.7 * ringDensity(length((p + Lp * ts).xz));
      }
    }
    float rim = pow(1.0 - mu, 2.5);
    col = mix(col, uAtmo.rgb * smoothstep(-0.3, 0.6, ndl), clamp(rim * uAtmo.w, 0.0, 1.0) * 0.75);
    // anti-alias the limb: fade into the glow over about one pixel
    float dmin = sqrt(max(0.0, dot(ro, ro) - b * b));
    float cover = clamp((1.0 - dmin) / max(uPix * -b * 1.5, 1e-6), 0.0, 1.0);
    col = mix(uAtmo.rgb * uAtmo.w * smoothstep(-0.35, 0.55, ndl), col, cover);
  }

  if (uRing.z > 0.0) {
    vec3 po = uOrient * ro;
    vec3 pd = uOrient * rd;
    if (abs(pd.y) > 1e-5) {
      float tr = -po.y / pd.y;
      if (tr > 0.0 && tr < tPlanet) {
        vec3 hp = po + pd * tr;
        float r = length(hp.xz);
        float a = ringDensity(r);
        if (a > 0.0) {
          vec3 Lp = uOrient * L;
          float sb2 = dot(hp, Lp);
          float shadow = (sb2 < 0.0 && sb2 * sb2 - (dot(hp, hp) - 1.0) > 0.0) ? 0.1 : 1.0;
          vec3 rc = uRingCol * (0.78 + 0.45 * noise1(r * 60.0 + uSeed)) * (0.35 + 0.65 * min(1.0, abs(Lp.y) * 3.0)) * shadow;
          col = mix(col, rc, a);
        }
      }
    }
  }

  vec2 vp = css / uView - 0.5;
  col *= 1.0 - 0.3 * dot(vp, vp);
  col += (hash12(gl_FragCoord.xy + fract(uTime * 13.0) * 371.0) - 0.5) * 0.025;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

  const LIGHT = (() => {
    const v = [-.5, .38, .78];
    const l = Math.hypot(...v);
    return v.map(x => x / l);
  })();

  function prepareLook(look) {
    const rad = Math.PI / 180;
    const ct = Math.cos((look.tilt || 0) * rad), st = Math.sin((look.tilt || 0) * rad);
    const cr = Math.cos((look.roll || 0) * rad), sr = Math.sin((look.roll || 0) * rad);
    // R = Rz(roll)·Rx(tilt) turns the planet frame into the world frame. Its
    // row-major entries are the column-major form of R^T, the inverse we need.
    look.orient = new Float32Array([cr, -sr * ct, sr * st, sr, cr * ct, -cr * st, 0, st, ct]);
    look.rgb = look.colors.map(hexToRgb);
    look.atmoRgb = hexToRgb(look.atmo);
    look.spotRgb = hexToRgb(look.spotColor || '#000000');
    look.ringRgb = hexToRgb(look.ringColor || '#000000');
  }

  function createRenderer() {
    const glCanvas = document.createElement('canvas');
    glCanvas.width = glCanvas.height = 4;
    let gl = null;
    try {
      gl = glCanvas.getContext('webgl', {
        alpha: false, antialias: false, depth: false, stencil: false,
        premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance'
      });
    } catch (error) { gl = null; }
    if (!gl) return null;

    const compile = (type, source) => {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
      console.warn('Planet shader failed to compile:', gl.getShaderInfoLog(shader));
      return null;
    };
    const vs = compile(gl.VERTEX_SHADER, VERTEX_SHADER);
    const fs = compile(gl.FRAGMENT_SHADER, FRAGMENT_SHADER);
    if (!vs || !fs) return null;
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.warn('Planet shader failed to link:', gl.getProgramInfoLog(program));
      return null;
    }
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, 'aPos');
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const u = {};
    ['uRes', 'uRect', 'uView', 'uCenter', 'uFocal', 'uDist', 'uPitch', 'uBank', 'uTime', 'uSpeed', 'uSeed', 'uPix',
     'uOrient', 'uLight', 'uKind', 'uC0', 'uC1', 'uC2', 'uC3', 'uGas', 'uSpot', 'uSpotCol', 'uRing', 'uRingCol',
     'uAtmo', 'uRock'].forEach(name => { u[name] = gl.getUniformLocation(program, name); });

    let lost = false;
    glCanvas.addEventListener('webglcontextlost', event => { event.preventDefault(); lost = true; });

    return {
      canvas: glCanvas,
      get usable() { return !lost; },
      // Draws `look` seen through `view` for the CSS-pixel region `box`.
      // Returns the part of the GL canvas that holds the picture.
      render(look, view, box, time, speed, budget) {
        const maxScale = Math.min(window.devicePixelRatio || 1, 2);
        const scale = Math.max(.3, Math.min(maxScale, Math.sqrt(budget / Math.max(1, box.w * box.h))));
        const w = Math.max(1, Math.round(box.w * scale));
        const h = Math.max(1, Math.round(box.h * scale));
        if (glCanvas.width < w || glCanvas.height < h) {
          glCanvas.width = Math.max(glCanvas.width, w);
          glCanvas.height = Math.max(glCanvas.height, h);
        }
        gl.viewport(0, 0, w, h);
        const spot = look.spot || [0, 0, 1, 0];
        const ring = look.ring || [0, 0, 0, 0];
        gl.uniform2f(u.uRes, w, h);
        gl.uniform4f(u.uRect, box.x, box.y, box.w, box.h);
        gl.uniform2f(u.uView, innerWidth, innerHeight);
        gl.uniform2f(u.uCenter, view.cx, view.cy);
        gl.uniform1f(u.uFocal, view.f);
        gl.uniform1f(u.uDist, view.dist);
        gl.uniform1f(u.uPitch, view.pitch);
        gl.uniform1f(u.uBank, view.bank);
        gl.uniform1f(u.uTime, time);
        gl.uniform1f(u.uSpeed, speed);
        gl.uniform1f(u.uSeed, look.seed);
        gl.uniform1f(u.uPix, 1 / (view.f * scale));
        gl.uniformMatrix3fv(u.uOrient, false, look.orient);
        gl.uniform3fv(u.uLight, LIGHT);
        gl.uniform1f(u.uKind, look.kind);
        gl.uniform3fv(u.uC0, look.rgb[0]);
        gl.uniform3fv(u.uC1, look.rgb[1]);
        gl.uniform3fv(u.uC2, look.rgb[2]);
        gl.uniform3fv(u.uC3, look.rgb[3]);
        gl.uniform4f(u.uGas, look.bands || 8, look.turbulence || 1, look.contrast || .3, look.streaks || 0);
        gl.uniform4f(u.uSpot, spot[0], spot[1], spot[2], spot[3]);
        gl.uniform3fv(u.uSpotCol, look.spotRgb);
        gl.uniform4f(u.uRing, ring[0], ring[1], ring[2], ring[3]);
        gl.uniform3fv(u.uRingCol, look.ringRgb);
        gl.uniform4f(u.uAtmo, look.atmoRgb[0], look.atmoRgb[1], look.atmoRgb[2], look.atmoStrength);
        gl.uniform4f(u.uRock, look.craters || 0, look.ice || 0, look.spin || 0, look.haze || .03);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        return { sx: 0, sy: glCanvas.height - h, sw: w, sh: h };
      }
    };
  }

  let gpu = null;
  let budget = 650000;          // pixels per full-screen pass; adapts to the device
  let frameAverage = 16;
  let budgetClock = 0;

  function adaptBudget(dt) {
    if (dt > 100) return;
    frameAverage += (dt - frameAverage) * .05;
    budgetClock += dt;
    if (budgetClock < 1000) return;
    budgetClock = 0;
    if (frameAverage > 22 && budget > 220000) budget *= .78;
    else if (frameAverage < 13 && budget < 900000) budget *= 1.1;
  }

  // Camera for planet `key`. a = 0 shows the whole planet small in the portal;
  // a = 1 is the close view used as the page background.
  function viewFor(key, a, cx, cy, rect) {
    const look = states[key].look;
    const H = innerHeight;
    const f = .95 * Math.max(innerWidth, H);
    const rFar = Math.max(20, .34 * Math.min(rect.width, rect.height) / (look.extent || 1));
    const dFar = Math.sqrt((f / rFar) ** 2 + 1);
    const sFar = Math.log(dFar - 1);
    const sClose = Math.log(look.close - 1);
    const dist = 1 + Math.exp(sFar + (sClose - sFar) * a);
    // Once the planet is big enough, tilt up so its horizon stays in place.
    const lift = Math.asin(Math.min(1, 1 / dist)) - Math.atan((.5 - look.horizon) * H / f);
    return { cx, cy, f, dist, pitch: Math.max(0, lift), bank: (look.bank || 0) * a * Math.PI / 180 };
  }

  // Very plain stand-in for browsers without WebGL.
  function drawPlanetFlat(look, view, box) {
    ctx.fillStyle = '#040404';
    ctx.fillRect(box.x, box.y, box.w, box.h);
    const r = view.f * Math.tan(Math.asin(Math.min(1, 1 / view.dist)));
    const y = view.cy + view.f * Math.tan(view.pitch);
    const gradient = ctx.createRadialGradient(view.cx - r * .3, y - r * .35, r * .05, view.cx, y, r);
    gradient.addColorStop(0, look.colors[2]);
    gradient.addColorStop(.55, look.colors[1]);
    gradient.addColorStop(1, look.colors[0]);
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(view.cx, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRendered(key, view, box, speed, now) {
    if (box.w < 1 || box.h < 1) return false;
    const look = states[key].look;
    if (gpu && gpu.usable) {
      const src = gpu.render(look, view, box, clockOf(key, now), speed, budget);
      ctx.drawImage(gpu.canvas, src.sx, src.sy, src.sw, src.sh, box.x, box.y, box.w, box.h);
      return true;
    }
    drawPlanetFlat(look, view, box);
    return false;
  }

  /* ----------------------------------------------------------------
     Canvas
     ---------------------------------------------------------------- */
  function resizeCanvas() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * d;
    canvas.height = innerHeight * d;
    canvas.style.width = `${innerWidth}px`;
    canvas.style.height = `${innerHeight}px`;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    portalRadius = parseFloat(getComputedStyle(portal).borderTopLeftRadius) || 90;
    fitTitle();
  }

  function mediaSize(media) {
    if (media instanceof HTMLVideoElement) return media.readyState >= 2 ? [media.videoWidth, media.videoHeight] : null;
    if (media instanceof HTMLImageElement) return media.complete ? [media.naturalWidth, media.naturalHeight] : null;
    return [media.width, media.height];
  }

  // Draws media like `object-fit: cover`, optionally zoomed about (fx, fy).
  function drawCover(context, media, zoom = 1, fx = innerWidth / 2, fy = innerHeight / 2) {
    if (!media) return;
    const size = mediaSize(media);
    if (!size || !size[0] || !size[1]) return;
    const scale = Math.max(innerWidth / size[0], innerHeight / size[1]);
    const w = size[0] * scale;
    const h = size[1] * scale;
    const x = (innerWidth - w) / 2;
    const y = (innerHeight - h) / 2;
    context.drawImage(media, fx + (x - fx) * zoom, fy + (y - fy) * zoom, w * zoom, h * zoom);
  }

  function drawShade(context) {
    const top = innerHeight * .52;
    const gradient = context.createLinearGradient(0, top, 0, innerHeight);
    gradient.addColorStop(0, 'rgba(0,0,0,0)');
    gradient.addColorStop(1, 'rgba(0,0,0,.88)');
    context.fillStyle = gradient;
    context.fillRect(0, top, innerWidth, innerHeight - top);
  }

  const CORNER_STEPS = 10;
  function roundedRectPoints(w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    const corners = [
      [ w / 2 - r, -h / 2 + r, -Math.PI / 2, 0],
      [ w / 2 - r,  h / 2 - r, 0, Math.PI / 2],
      [-w / 2 + r,  h / 2 - r, Math.PI / 2, Math.PI],
      [-w / 2 + r, -h / 2 + r, Math.PI, Math.PI * 1.5]
    ];
    const points = [];
    for (const [ox, oy, a0, a1] of corners) {
      for (let i = 0; i <= CORNER_STEPS; i++) {
        const a = a0 + (a1 - a0) * (i / CORNER_STEPS);
        points.push([ox + Math.cos(a) * r, oy + Math.sin(a) * r]);
      }
    }
    return points;
  }

  const FOCAL = 850;
  function project(x, y, rx, ry, cx, cy) {
    const ax = rx * Math.PI / 180;
    const ay = ry * Math.PI / 180;
    const xx = x * Math.cos(ay);
    const yy = y * Math.cos(ax);
    const z = x * Math.sin(ay) - y * Math.sin(ax);
    const p = FOCAL / (FOCAL + z);
    return [cx + xx * p, cy + yy * p];
  }

  // The planet behind the portal: the intro video (DOM), a still frame, or a live render.
  function drawBackground(now, rect) {
    if (scene.mode === 'dom') return false;
    let usedGpu = false;
    if (scene.mode === 'still') drawCover(ctx, scene.media, scene.zoom);
    else usedGpu = drawRendered(current, viewFor(current, 1, innerWidth / 2, innerHeight / 2, rect),
      { x: 0, y: 0, w: innerWidth, h: innerHeight }, 0, now);
    drawShade(ctx);
    return usedGpu;
  }

  // What shows inside the portal window.
  function drawWindow(now, cx, cy, rx, ry, box, rect) {
    if (travelState) {
      const { target, arrival } = travelState;
      if (arrival.mode === 'clip') drawCover(ctx, transitionVideo);
      else if (arrival.mode === 'still') drawCover(ctx, arrival.media, 1 + (STILL_ZOOM - 1) * travelState.zoom, cx, cy);
      else return drawRendered(target, viewFor(target, travelState.approach, cx, cy, rect), box, travelState.speed, now);
      return false;
    }
    const key = pendingTarget || nextOf(current);
    const arrival = arrivalOf(key);
    if (arrival.mode === 'clip') drawCover(ctx, portalVideoKey === key ? portalVideo : transitionVideo);
    else if (arrival.mode === 'still') drawCover(ctx, arrival.media);
    // A little parallax: the far planet drifts toward the pointer as the window tilts.
    else return drawRendered(key, viewFor(key, 0, cx + ry * .9, cy - rx * .9, rect), box, 0, now);
    return false;
  }

  function draw(now) {
    const rawDt = now - lastFrame;
    const dt = Math.min(40, Math.max(0, rawDt));
    lastFrame = now;
    const k = Math.min(1, dt * .009);
    rotX += (targetX - rotX) * k;
    rotY += (targetY - rotY) * k;

    const W = innerWidth;
    const H = innerHeight;
    ctx.clearRect(0, 0, W, H);

    const rect = portal.getBoundingClientRect();
    const e = expansion;
    let usedGpu = e < 1 ? drawBackground(now, rect) : false;

    const rcx = rect.left + rect.width / 2;
    const rcy = rect.top + rect.height / 2;
    const cx = rcx + (W / 2 - rcx) * e;
    const cy = rcy + (H / 2 - rcy) * e;
    const baseW = rect.width + (W - rect.width) * e;
    const baseH = rect.height + (H - rect.height) * e;
    const scale = e ? 1 : maskScale;
    const w = baseW * scale;
    const h = baseH * scale;
    const r = portalRadius * (1 - e) * scale;
    const rx = rotX * (1 - e);
    const ry = rotY * (1 - e);

    if (w > 1 && h > 1) {
      const points = roundedRectPoints(w, h, r).map(([x, y]) => project(x, y, rx, ry, cx, cy));
      let minX = W, minY = H, maxX = 0, maxY = 0;
      ctx.save();
      ctx.globalAlpha = canvasOpacity;
      ctx.beginPath();
      points.forEach(([sx, sy], i) => {
        if (i) ctx.lineTo(sx, sy); else ctx.moveTo(sx, sy);
        minX = Math.min(minX, sx); maxX = Math.max(maxX, sx);
        minY = Math.min(minY, sy); maxY = Math.max(maxY, sy);
      });
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = '#030303';
      ctx.fillRect(0, 0, W, H);
      const x0 = Math.max(0, Math.floor(minX));
      const y0 = Math.max(0, Math.floor(minY));
      const box = { x: x0, y: y0, w: Math.min(W, Math.ceil(maxX)) - x0, h: Math.min(H, Math.ceil(maxY)) - y0 };
      if (drawWindow(now, cx, cy, rx, ry, box, rect)) usedGpu = true;
      if (travelState) drawShade(ctx);
      ctx.restore();
    }

    if (usedGpu) adaptBudget(rawDt);
    requestAnimationFrame(draw);
  }

  /* ----------------------------------------------------------------
     Reveal sequences
     ---------------------------------------------------------------- */
  function revealMask() {
    retrigger(experience, 'mask-revealing');
    maskScale = 0;
    return animateValue(v => { maskScale = v; }, 1050);
  }

  function revealPlanetContent() {
    retrigger(experience, 'content-revealing');
  }

  async function startExperience() {
    await waitForMedia(previewMedia(nextOf(current)));
    await revealMask();
    document.body.classList.add('intro-ready');
    ready = true;
    setTimeout(revealPlanetContent, 850);
  }

  /* ----------------------------------------------------------------
     Travel
     ---------------------------------------------------------------- */
  async function travel(target = nextOf(current)) {
    if (!ready || busy || !states[target] || target === current) return;
    busy = true;
    targetX = 0;
    targetY = 0;
    cursor.classList.remove('is-enter');
    if (epochs[target] === undefined || target !== nextOf(current)) epochs[target] = performance.now();
    pendingTarget = target;
    setHeading(target);
    let arrival = arrivalOf(target);

    try {
      if (arrival.mode === 'clip') {
        transitionVideo.src = arrival.clip;
        transitionVideo.load();
        experience.classList.add('is-loading');
        await waitFor(transitionVideo, ['canplaythrough', 'error'], 1600);
        if (transitionVideo.error) {
          failed.add(target);
          arrival = { mode: 'render' };
        }
      }

      experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
      experience.classList.add('is-transitioning');
      canvasOpacity = 1;
      travelState = { target, arrival, approach: 0, zoom: 0, speed: 0 };

      if (arrival.mode === 'clip') {
        transitionVideo.currentTime = 0;
        transitionVideo.playbackRate = 1.3;
        try {
          await transitionVideo.play();
        } catch (error) {
          // The video would not play: fly there with the renderer instead.
          failed.add(target);
          arrival = travelState.arrival = { mode: 'render' };
        }
      }

      if (arrival.mode === 'clip') {
        await animateValue(v => { expansion = v; }, 1100);
        await waitForEnd(transitionVideo);
        const frame = captureFrame(transitionVideo);
        if (frame) stills[target] = frame;
        scene = frame ? { mode: 'still', media: frame, zoom: 1 } : { mode: 'render' };
      } else if (arrival.mode === 'still') {
        await Promise.all([
          animateValue(v => { expansion = v; }, 1100),
          animateValue(v => { travelState.zoom = v; }, 1900)
        ]);
        scene = { mode: 'still', media: arrival.media, zoom: STILL_ZOOM };
      } else {
        await Promise.all([
          animateValue(v => { expansion = v; }, 1100),
          animate(t => {
            travelState.approach = ease(t);
            travelState.speed = Math.sin(Math.PI * t);
          }, 3000)
        ]);
        scene = { mode: 'render' };
      }

      current = target;
      pendingTarget = null;
      experience.classList.add('is-committing');
      render();
      await nextFrame();
      await nextFrame();

      travelState = null;
      expansion = 0;
      maskScale = 0;
      canvasOpacity = 1;
      experience.classList.remove('is-transitioning', 'is-committing');

      const maskReveal = revealMask();
      setTimeout(revealPlanetContent, 100);
      await maskReveal;

      await wait(450);
      if (arrival.mode === 'clip') {
        transitionVideo.removeAttribute('src');
        transitionVideo.load();
      }
      busy = false;
    } catch (error) {
      console.warn('Portal travel interrupted:', error);
      travelState = null;
      pendingTarget = null;
      expansion = 0;
      maskScale = 1;
      canvasOpacity = 1;
      setHeading(nextOf(current));
      experience.classList.remove('is-loading', 'is-transitioning', 'is-committing');
      transitionVideo.pause();
      // Bring the chrome back if it had already been cleared.
      if (!experience.classList.contains('content-revealing')) revealPlanetContent();
      if (!experience.classList.contains('mask-revealing')) retrigger(experience, 'mask-revealing');
      busy = false;
    }
  }

  portal.addEventListener('click', () => travel());
  planetList.addEventListener('click', event => {
    const item = event.target.closest('[data-planet]');
    if (item) travel(item.dataset.planet);
  });

  // If a planet's media cannot load, draw that planet instead of showing black.
  portalVideo.addEventListener('error', () => failed.add(portalVideoKey));
  portalImage.addEventListener('error', () => failed.add('mercury'));
  preloaderVideo.addEventListener('ended', () => { stills.mars = captureFrame(preloaderVideo); });

  /* ----------------------------------------------------------------
     Pointer: tilt + custom cursor
     ---------------------------------------------------------------- */
  let pointerX = innerWidth / 2;
  let pointerY = innerHeight / 2;
  let cursorX = pointerX;
  let cursorY = pointerY;
  let hasPointer = false;

  function resetTilt() {
    targetX = 0;
    targetY = 0;
  }

  function hideCursor() {
    cursor.classList.remove('is-visible');
  }

  window.addEventListener('pointermove', event => {
    if (event.pointerType === 'touch') return;   // touch: tilt stays at 0
    pointerX = event.clientX;
    pointerY = event.clientY;
    if (!hasPointer) {
      cursorX = pointerX;
      cursorY = pointerY;
      hasPointer = true;
    }
    cursor.classList.add('is-visible');
    if (!busy) {
      targetY = (event.clientX / innerWidth - .5) * 37.4;
      targetX = (event.clientY / innerHeight - .5) * -33;
    }
  }, { passive: true });

  document.documentElement.addEventListener('pointerleave', resetTilt);
  document.addEventListener('mouseleave', hideCursor);
  window.addEventListener('pointerout', event => {
    if (!event.relatedTarget) {
      resetTilt();
      hideCursor();
    }
  });

  portal.addEventListener('pointerenter', () => cursor.classList.add('is-enter'));
  portal.addEventListener('pointerleave', () => cursor.classList.remove('is-enter'));
  planetList.addEventListener('pointerover', event => {
    if (event.target.closest('[data-planet]')) cursor.classList.add('is-hover');
  });
  planetList.addEventListener('pointerout', event => {
    if (event.target.closest('[data-planet]')) cursor.classList.remove('is-hover');
  });

  function cursorLoop() {
    cursorX += (pointerX - cursorX) * .2;
    cursorY += (pointerY - cursorY) * .2;
    cursor.style.transform = `translate3d(${cursorX.toFixed(2)}px,${cursorY.toFixed(2)}px,0)`;
    requestAnimationFrame(cursorLoop);
  }

  /* ----------------------------------------------------------------
     Preloader
     ---------------------------------------------------------------- */
  function runPreloader() {
    const video = preloaderVideo;
    let finished = false;
    let started = false;
    let raf = 0;
    let shown = '0';
    video.muted = true;

    const tick = () => {
      if (finished) return;
      const duration = video.duration;
      if (Number.isFinite(duration) && duration > 0) {
        const value = String(Math.min(100, Math.round(video.currentTime / duration * 100)));
        if (value !== shown) preloaderValue.textContent = shown = value;
      }
      raf = requestAnimationFrame(tick);
    };

    const finish = () => {
      if (finished) return;
      finished = true;
      cancelAnimationFrame(raf);
      clearTimeout(safety);
      // No intro picture to stand in for Mars: draw Mars instead.
      if (video.error || video.readyState < 2) {
        failed.add('mars');
        if (current === 'mars') scene = { mode: 'render' };
      }
      preloaderValue.textContent = '100';
      preloaderCount.classList.add('is-leaving');
      floatingLogo.classList.add('is-docked');
      preloader.classList.add('is-background');
      document.body.classList.add('preload-complete');
      startExperience();
      setTimeout(() => preloaderCount.remove(), 750);
      setTimeout(() => floatingLogo.classList.add('is-settled'), 2000);
    };

    const start = () => {
      if (started || finished) return;
      started = true;
      const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 3;
      video.playbackRate = Math.min(16, Math.max(.25, duration / 3));   // ~3 s sequence
      const playing = video.play();
      if (playing && playing.catch) playing.catch(finish);
      raf = requestAnimationFrame(tick);
    };

    video.addEventListener('ended', finish, { once: true });
    video.addEventListener('error', finish, { once: true });
    // Never strand the visitor behind the preloader if the network stalls.
    const safety = setTimeout(finish, 15000);

    if (video.error) finish();
    else if (video.readyState >= 1) start();
    else video.addEventListener('loadedmetadata', start, { once: true });
  }

  /* ----------------------------------------------------------------
     Boot
     ---------------------------------------------------------------- */
  Object.values(states).forEach(state => prepareLook(state.look));
  gpu = createRenderer();

  window.addEventListener('resize', resizeCanvas);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

  backgrounds.forEach(video => {
    video.pause();
    video.currentTime = 0;
  });
  resizeCanvas();
  render();
  requestAnimationFrame(draw);
  requestAnimationFrame(cursorLoop);
  runPreloader();
})();
</script>
</body>
</html>
